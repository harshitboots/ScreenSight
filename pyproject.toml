[project]
name = "screensight"
version = "0.1.0"
description = "Universal 'let the agent see your screen' tool — works as an MCP server (Claude Code, Cursor, Windsurf, Cline, Codex CLI) or a plain CLI (Aider, shell scripts, anything)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HARSHIT TRIPATHI" }]
dependencies = [
    "fastmcp>=2.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
]

[project.scripts]
screensight = "screensight.__main__:main"
screensight-mcp = "screensight.mcp_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screensight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = [
    # The switch check, the redact-zone loader and the daemon status reader all
    # swallow every exception on purpose: any failure to read state must fail
    # closed (capture stays off, the default blocklist applies) rather than
    # propagate. Narrowing these to specific exception types would let an
    # unexpected error escape a privacy-critical path.
    "BLE001", # blind-except
    "S110",   # try-except-pass
]
