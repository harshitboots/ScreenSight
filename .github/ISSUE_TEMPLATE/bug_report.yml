name: Bug report
description: Something isn't working as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please check
        [GUIDE.md → Troubleshooting](../blob/main/GUIDE.md#troubleshooting) first —
        it covers the most common failures ("capture failed: off", blocklist matches,
        PowerShell errors, "daemon already running", MCP server not starting).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: I ran `screensight capture` and…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) and their full output.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - CLI (screensight)
        - MCP server (screensight-mcp)
        - Watch daemon
        - Installer (install.sh / install.ps1)
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Note that macOS, Linux, and WSL backends are currently untested.
      options:
        - Windows
        - macOS
        - Linux
        - WSL
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version` (must be 3.10+).
      placeholder: "3.11.5"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ScreenSight version or commit
      placeholder: "0.1.0"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmation
      options:
        - label: My report does not include a screenshot or window title containing sensitive information.
          required: true
