name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      # Tests mock all capture backends and never take a real screenshot,
      # so no display is required on CI runners.
      - name: Run tests
        run: pytest tests/ -v

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    # Advisory for now: the initial codebase has known lint/format findings.
    # Cleaning these up (and flipping this to blocking) is a tracked good-first-issue.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned: an unpinned install silently picks up new default rules on
        # every ruff release, which turns this job red without a code change.
        run: pip install ruff==0.16.3

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests
